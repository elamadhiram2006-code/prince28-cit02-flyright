
name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to deploy (leave empty for latest)"
        required: false
        type: string

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.sha || github.sha }}

      - name: Set deployment SHA
        id: version
        run: |
          SHA="${{ github.event.workflow_run.head_sha || inputs.sha || github.sha }}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run database migrations
        env:
          APP_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run alembic upgrade head

      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          IMAGE: ghcr.io/${{ github.repository }}:sha-${{ steps.version.outputs.sha }}
        run: |
          ENCODED_IMAGE=$(python -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['IMAGE'], safe=''))")
          curl -fsS "${RENDER_DEPLOY_HOOK}&imgURL=${ENCODED_IMAGE}"

      - name: Wait for deployment
        run: sleep 60

      - name: Smoke test
        env:
          LIVE_URL: ${{ vars.LIVE_URL }}
          EXPECTED_SHA: ${{ steps.version.outputs.sha }}
        run: uv run python scripts/smoke.py
