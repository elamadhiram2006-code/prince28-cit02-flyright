
name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: lint and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app # pragma: allowlist secret
          POSTGRES_DB: app_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: ci
      DATABASE_URL: postgresql+asyncpg://app:app@localhost:5433/app_test # pragma: allowlist secret
      TEST_DATABASE_URL: postgresql://app:app@localhost:5433/app_test # pragma: allowlist secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run lint
        run: uv run poe lint

      - name: Run tests with coverage
        run: uv run poe cov

  image:
    name: build image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/elamadhiram2006-code/flyright:sha-${{ github.sha }}
            ghcr.io/elamadhiram2006-code/flyright:main
